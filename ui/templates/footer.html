<script>
(function() {
  var path = window.location.pathname;
  var links = document.querySelectorAll('.nav-link');
  var activeFound = false;
  links.forEach(function(a) {
    var href = a.getAttribute('href');
    if (href === path) {
      a.classList.add('bg-surface-variant', 'text-primary', 'font-bold');
      a.classList.remove('text-on-surface-variant');
      activeFound = true;
    }
    if (!activeFound && path !== '/' && href !== '/' && path.startsWith(href)) {
      a.classList.add('bg-surface-variant', 'text-primary', 'font-bold');
      a.classList.remove('text-on-surface-variant');
    }
  });
  document.querySelectorAll('.glass-card').forEach(function(card) {
    card.addEventListener('mouseenter', function() { this.style.borderColor = 'rgba(255,255,255,0.1)'; });
    card.addEventListener('mouseleave', function() { this.style.borderColor = 'rgba(255,255,255,0.04)'; });
  });
})();
</script>
