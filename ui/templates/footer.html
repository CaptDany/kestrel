</main>
<nav class="fixed bottom-4 left-4 right-4 z-50 flex justify-around items-center px-4 h-16 md:hidden glass-nav shadow-lg rounded-full mobile-bottomnav" id="bottom-nav">
<a class="nav-link flex flex-col items-center justify-center py-1 px-3 text-on-surface-variant hover:bg-surface-container-high transition-all rounded-xl" href="/">
<span class="material-symbols-outlined text-[24px]">dashboard</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="nav-link flex flex-col items-center justify-center py-1 px-3 text-on-surface-variant hover:bg-surface-container-high transition-all rounded-xl" href="/items">
<span class="material-symbols-outlined text-[24px]">inventory_2</span>
<span class="font-label-sm text-label-sm">Items</span>
</a>
<a class="nav-link flex flex-col items-center justify-center py-1 px-3 text-on-surface-variant hover:bg-surface-container-high transition-all rounded-xl" href="/schedule">
<span class="material-symbols-outlined text-[24px]">calendar_today</span>
<span class="font-label-sm text-label-sm">Schedule</span>
</a>
<a class="nav-link flex flex-col items-center justify-center py-1 px-3 text-on-surface-variant hover:bg-surface-container-high transition-all rounded-xl" href="/settings">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<script>
(function() {
  var path = window.location.pathname;
  var links = document.querySelectorAll('.nav-link');
  var activeFound = false;
  links.forEach(function(a) {
    var href = a.getAttribute('href');
    if (href === path) {
      a.classList.add('bg-primary-container', 'text-on-primary-container');
      a.classList.remove('text-on-surface-variant');
      a.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
      activeFound = true;
    }
    if (!activeFound && path !== '/' && href !== '/' && path.startsWith(href)) {
      a.classList.add('bg-primary-container', 'text-on-primary-container');
      a.classList.remove('text-on-surface-variant');
      a.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
    }
  });
  document.querySelectorAll('.glass-card').forEach(function(card) {
    card.addEventListener('mouseenter', function() { this.style.borderColor = 'rgba(255,255,255,0.1)'; });
    card.addEventListener('mouseleave', function() { this.style.borderColor = 'rgba(255,255,255,0.04)'; });
  });
})();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
</script>
</div>
</body>
</html>
{{end}}
