{{template "header" .}}
{{$item := .Data}}
<form id="item-form" x-data="itemForm()" @submit.prevent="save">
    <input type="hidden" name="id" x-model="id">
    <div class="field">
        <label class="label">URL</label>
        <div class="control"><input class="input" type="url" name="url" x-model="url" placeholder="https://..." required></div>
    </div>
    <div class="field">
        <label class="label">Title</label>
        <div class="control"><input class="input" type="text" name="title" x-model="title" placeholder="Item name"></div>
        <p class="help">Auto-detected from URL if available.</p>
    </div>
    <div class="columns">
        <div class="column">
            <div class="field">
                <label class="label">Price</label>
                <div class="control"><input class="input" type="number" step="0.01" name="price" x-model="price" placeholder="0.00"></div>
            </div>
        </div>
        <div class="column">
            <div class="field">
                <label class="label">Currency</label>
                <div class="control"><input class="input" type="text" name="currency" x-model="currency" placeholder="USD"></div>
            </div>
        </div>
    </div>
    <div class="columns">
        <div class="column">
            <div class="field">
                <label class="label">Priority</label>
                <div class="control">
                    <div class="select">
                        <select name="priority" x-model.number="priority">
                            <option value="-1">Low</option>
                            <option value="0" selected>Normal</option>
                            <option value="1">High</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="column">
            <div class="field">
                <label class="label">Category</label>
                <div class="control"><input class="input" type="text" name="category" x-model="category" placeholder="e.g. Electronics"></div>
            </div>
        </div>
    </div>
    <div class="field">
        <label class="label">Desired Date</label>
        <div class="control"><input class="input" type="date" name="desired_date" x-model="desiredDate"></div>
        <p class="help">Optional.</p>
    </div>
    <div class="field">
        <label class="label">Notes</label>
        <div class="control"><textarea class="textarea" name="notes" x-model="notes" placeholder="Any notes..."></textarea></div>
    </div>
    <div class="field is-grouped">
        <div class="control"><button class="button is-primary" type="submit">{{if $item}}Update{{else}}Add{{end}} Item</button></div>
        <div class="control"><a class="button is-light" href="/items">Cancel</a></div>
    </div>
</form>
<script>
function itemForm() {
    {{if $item}}
    return {
        id: {{$item.ID}}, url: '{{$item.URL}}', title: '{{$item.Title}}',
        price: {{if $item.Price}}{{$item.Price}}{{else}}''{{end}}, currency: '{{$item.Currency}}',
        priority: {{$item.Priority}}, category: '{{$item.Category}}', notes: '{{$item.Notes}}',
        desiredDate: '{{derefs $item.DesiredDate}}',
        save() {
            const method = this.id ? 'PUT' : 'POST';
            const url = this.id ? '/api/items/'+this.id : '/api/items';
            fetch(url, { method, headers:{'Content-Type':'application/json'},
                body: JSON.stringify({url:this.url, title:this.title, price:this.price?parseFloat(this.price):null,
                    currency:this.currency||'USD', priority:this.priority, category:this.category,
                    notes:this.notes, desired_date:this.desiredDate||null, status:'pending', price_confirmed:this.price?1:0})
            }).then(r => { if(r.ok) window.location.href='/items'; });
        }
    };
    {{else}}
    return {
        id:0, url:'', title:'', price:'', currency:'USD', priority:0, category:'', notes:'', desiredDate:'',
        save() {
            fetch('/api/items', { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({url:this.url, title:this.title, price:this.price?parseFloat(this.price):null,
                    currency:this.currency||'USD', priority:this.priority, category:this.category,
                    notes:this.notes, desired_date:this.desiredDate||null, status:'pending', price_confirmed:this.price?1:0})
            }).then(r => { if(r.ok) window.location.href='/items'; });
        }
    };
    {{end}}
}
</script>
{{template "footer" .}}
