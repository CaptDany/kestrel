{{define "header"}}

        "error": "#ffb4ab",

        "on-primary-fixed-variant": "#0439b3",
        "outline": "#8e909f",
        "on-error": "#690005",
        "on-secondary": "#2f3033",
        "secondary-container": "#48494c",
        "on-tertiary-fixed-variant": "#783100",
        "surface-container-lowest": "#0c0e15",

        "on-secondary-fixed": "#1a1b1e",

<style>
{{$bgMode := index .Settings "background_mode"}}
{{$bgValue := index .Settings "background_value"}}
{{$bgOverlay := index .Settings "background_overlay"}}
{{if eq $bgMode "image"}}
body { background: url('{{$bgValue}}') center/cover fixed; color: #e2e1ec; font-family: 'Inter', sans-serif; position: relative; }
body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,{{$bgOverlay}}); z-index: -1; pointer-events: none; }
{{else if eq $bgMode "gradient"}}
body { background: {{$bgValue}}; color: #e2e1ec; font-family: 'Inter', sans-serif; }
{{else}}
body { background-color: {{$bgValue}}; color: #e2e1ec; font-family: 'Inter', sans-serif; }
{{end}}
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.fill-icon { font-variation-settings: 'FILL' 1; }
.glass-card { background: rgba(26, 27, 30, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.04); transition: all 0.2s ease-in-out; }
.glass-card:hover { background: rgba(44, 45, 49, 0.9); border-color: rgba(255, 255, 255, 0.08); }
.tonal-layer-1 { background-color: #1A1B1E; border: 1px solid rgba(255, 255, 255, 0.04); }
.tonal-layer-2 { background-color: #2C2D31; }
.shimmer { background: linear-gradient(90deg, #1A1B1E 25%, #2C2D31 50%, #1A1B1E 75%); background-size: 200% 100%; animation: shimmer 2s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }
::-webkit-scrollbar { width: 6px; }
{{if eq $bgMode "image"}}
::-webkit-scrollbar-track { background: transparent; }
{{else}}
::-webkit-scrollbar-track { background: {{$bgValue}}; }
{{end}}
::-webkit-scrollbar-thumb { background: #2C2D31; border-radius: 10px; }
.htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
.htmx-request .htmx-indicator { opacity: 1; }
.htmx-request.htmx-indicator { opacity: 1; }
tr.htmx-swapping { opacity: 0; transition: opacity 200ms ease-out; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.toast-enter { animation: toast-in 0.3s ease-out; }
.toast-exit { animation: toast-out 0.3s ease-in forwards; }
@keyframes toast-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.glass-glow { box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05); }
</style>
<script>
document.addEventListener('alpine:init', function() {
  Alpine.store('toast', {
    show: false, message: '', type: 'success', timer: null,
    fire(msg, t) {
      this.message = msg; this.type = t || 'success'; this.show = true;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => { this.show = false; }, 3000);
    }
  });
  Alpine.store('confirm', {
    show: false, message: '', onConfirm: null,
    fire(msg, callback) {
      this.message = msg; this.onConfirm = callback; this.show = true;
    },
    confirm() {
      if (this.onConfirm) this.onConfirm();
      this.show = false; this.onConfirm = null;
    },
    cancel() {
      this.show = false; this.onConfirm = null;
    }
  });
});
function toast(msg, type) { Alpine.store('toast').fire(msg, type); }
function confirmAction(msg, callback) { Alpine.store('confirm').fire(msg, callback); }
</script>
</head>
<body class="overflow-x-hidden">
<div class="flex min-h-screen">
<aside class="fixed left-0 top-0 h-screen w-[240px] bg-surface-container-low flex-col gap-lg p-md hidden md:flex z-50 border-r border-outline-variant/10">
<div class="flex items-center gap-sm px-2">
<img src="/static/logo/kestrel.svg" alt="" class="h-7"/>
</div>
<nav class="flex-1 flex flex-col gap-sm" id="sidebar-nav">
<a class="nav-link flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded-lg" href="/">
<span class="material-symbols-outlined">dashboard</span><span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="nav-link flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded-lg" href="/items">
<span class="material-symbols-outlined">inventory_2</span><span class="font-label-md text-label-md">Items</span>
</a>
<a class="nav-link flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded-lg" href="/schedule">
<span class="material-symbols-outlined">calendar_today</span><span class="font-label-md text-label-md">Schedule</span>
</a>
<a class="nav-link flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded-lg" href="/history">
<span class="material-symbols-outlined">receipt_long</span><span class="font-label-md text-label-md">History</span>
</a>
<a class="nav-link flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all rounded-lg" href="/settings">
<span class="material-symbols-outlined">settings</span><span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<div class="mt-auto pt-md border-t border-outline-variant/10">
<a href="/items/new" class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined text-sm">add</span><span class="font-label-md text-label-md">New Purchase</span>
</a>
</div>
</aside>
<nav class="md:hidden fixed top-0 left-0 right-0 z-[60] bg-surface px-container-margin-mobile py-md border-b border-outline-variant/10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<img src="/static/logo/kestrel.svg" alt="" class="h-6"/>
</div>
<div class="flex items-center gap-md">
<button class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-0 right-0 w-2 h-2 bg-primary rounded-full border-2 border-surface"></span>
</button>
<a href="/settings" class="text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined">settings</span>
</a>
</div>
</div>
</nav>
<main class="flex-1 md:ml-[240px] p-container-margin-mobile md:p-container-margin-desktop min-h-screen pb-32 md:pb-xl w-full max-w-full pt-[68px] md:pt-0">
<div x-data x-show="$store.toast.show" x-cloak class="fixed top-4 right-4 z-[200] max-w-sm w-full pointer-events-none" @click="$store.toast.show=false">
  <div class="pointer-events-auto glass-card rounded-xl px-lg py-md flex items-center gap-3 shadow-2xl" :class="$store.toast.type==='error'?'border-l-4 border-red-500':'border-l-4 border-emerald-500'" x-init="$el.classList.add('toast-enter')">
    <span class="material-symbols-outlined" :class="$store.toast.type==='error'?'text-red-400':'text-emerald-400'" x-text="$store.toast.type==='error'?'error':'check_circle'"></span>
    <span class="font-body-md text-body-md text-on-surface flex-1" x-text="$store.toast.message"></span>
  </div>
</div>
<div x-data x-show="$store.confirm.show" x-cloak class="fixed inset-0 z-[300] flex items-center justify-center p-md" @keydown.escape="$store.confirm.cancel()">
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="$store.confirm.cancel()"></div>
  <div class="glass-card rounded-2xl p-xl max-w-sm w-full shadow-2xl relative z-10" @click.outside="$store.confirm.cancel()">
    <div class="flex items-start gap-3 mb-lg">
      <div class="w-10 h-10 rounded-full bg-red-500/15 flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-red-400 text-xl">warning</span>
      </div>
      <div>
        <h3 class="font-headline-md text-headline-md text-on-surface mb-1">Confirm</h3>
        <p class="font-body-md text-body-md text-on-surface-variant" x-text="$store.confirm.message"></p>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <button class="px-5 py-2.5 rounded-xl border border-outline-variant/30 text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors" @click="$store.confirm.cancel()">Cancel</button>
      <button class="px-5 py-2.5 rounded-xl bg-red-600 text-white font-label-md text-label-md hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-red-600/20" @click="$store.confirm.confirm()">Delete</button>
    </div>
  </div>
</div>
{{if .Error}}<div class="bg-error-container text-on-error-container px-lg py-md rounded-xl mb-lg flex items-center gap-3"><span class="material-symbols-outlined">error</span><span>{{.Error}}</span></div>{{end}}
{{end}}
